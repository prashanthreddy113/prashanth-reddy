# Static site: publish this folder as-is, no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Single-page site: every path serves index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
