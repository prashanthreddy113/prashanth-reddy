# One-click deploy of the API + PostgreSQL on Render (https://render.com).
# Render → New → Blueprint → point at this repository. Then set VITE_API_URL on Netlify to the API URL Render gives you.
services:
  - type: web
    name: brightloop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brightloop-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Admin__Username
        value: admin
      - key: Admin__Password
        sync: false   # set this in the Render dashboard
      - key: Cors__AllowedOrigins
        sync: false   # e.g. https://your-site.netlify.app
      - key: Room__Name
        value: BrightLoop Reading Room
      - key: WhatsApp__PhoneNumberId
        sync: false   # from Meta WhatsApp Business platform
      - key: WhatsApp__AccessToken
        sync: false   # permanent system-user token
      - key: WhatsApp__DefaultCountryCode
        value: "91"
      - key: Reminders__TriggerKey
        generateValue: true


  # ---- Yukktha Platform API (yukktha-platform/) ----
  - type: web
    name: yukktha-api
    runtime: docker
    dockerfilePath: ./yukktha-platform/src/Dockerfile
    dockerContext: ./yukktha-platform/src
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yukktha-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Platform__RootDomain
        value: yukktha.in
      - key: Otp__DevMode
        value: "true"   # returns the OTP in the API response; set to "false" once WhatsApp credentials are configured
      - key: WhatsApp__PhoneNumberId
        sync: false   # from Meta WhatsApp Business platform
      - key: WhatsApp__AccessToken
        sync: false
      - key: WhatsApp__VerifyToken
        generateValue: true
      - key: Razorpay__KeyId
        sync: false
      - key: Razorpay__KeySecret
        sync: false
      - key: Razorpay__WebhookSecret
        sync: false
      - key: Razorpay__PlanIds__Starter
        sync: false   # plan_xxx ids from Razorpay → Subscriptions → Plans (₹999, ₹2,499, ₹7,500 monthly)
      - key: Razorpay__PlanIds__Growth
        sync: false
      - key: Razorpay__PlanIds__MultiBranch
        sync: false
      - key: Platform__TrialRequiresPaymentMethod
        value: "true"   # BL-2: storefront opens only after UPI autopay or a card is authorised
      - key: Storage__BlobConnectionString
        sync: false   # Azure Blob Storage for product images (optional)

databases:
  - name: brightloop-db
    plan: free
  - name: yukktha-db
    plan: free
