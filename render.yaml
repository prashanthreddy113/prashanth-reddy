# One-click deploy of the API + PostgreSQL on Render (https://render.com).
# Render → New → Blueprint → point at this repository. Then set VITE_API_URL on Netlify to the API URL Render gives you.
services:
  - type: web
    name: brightloop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brightloop-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Admin__Username
        value: admin
      - key: Admin__Password
        sync: false   # set this in the Render dashboard
      - key: Cors__AllowedOrigins
        sync: false   # e.g. https://your-site.netlify.app
      - key: Room__Name
        value: BrightLoop Reading Room

databases:
  - name: brightloop-db
    plan: free
