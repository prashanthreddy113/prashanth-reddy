# Netlify configuration for the React admin frontend.
# The .NET API is hosted separately (see README "Deploy the API"); set VITE_API_URL
# in Netlify → Site configuration → Environment variables to that API's public URL.

[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"
  # Netlify skips builds when nothing changed inside the base directory. Also build
  # when the Srujan Reddy static site or this config changes (paths relative to base).
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../srujan-reddy-site ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Public URL of the .NET API. A VITE_API_URL set in the Netlify dashboard overrides this.
  VITE_API_URL = "https://brightloop-api.onrender.com"

# Single-page app: every route is served by index.html (React Router handles it).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Netlify project "srujan-reddy-congress" builds this branch. It is a plain static
# site, so skip the React build and publish the srujan-reddy-site folder instead.
# (Paths are relative to the base directory "frontend" above.)
[context."claude/srujan-reddy-political-site-w7o5a1"]
  command = "rm -rf dist && cp -r ../srujan-reddy-site dist"
  publish = "dist"
