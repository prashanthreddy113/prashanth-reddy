# Yukktha storefront — static site, no build step.
# In Netlify: Base directory = yukktha, Publish directory = yukktha (or "." from here).
[build]
  publish = "."

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Yukktha's own checkout service (netlify/functions): create-order, verify-payment,
# razorpay-webhook, checkout-status. Until the Firebase keys are added as environment
# variables, the functions pass orders to the previous service, so checkout never breaks.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# the function source lives inside the published folder — never serve it as files
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

# Friendly URLs: /collections/kanjivaram-silk -> collection page
[[redirects]]
  from = "/collections/:slug"
  to = "/collection.html?c=:slug"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
