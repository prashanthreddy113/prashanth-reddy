  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>
  <main id="main">
    <section class="banner" id="banner">

    <p class="coll-intro" id="collIntro"></p>

    <div class="toolbar" id="toolbar">
      <button class="filter-toggle" id="filterToggle" type="button" aria-controls="filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>

      <div class="density" role="group" aria-label="Grid density">
        <button type="button" data-cols="2" aria-label="Two per row"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg></button>
        <button type="button" data-cols="4" aria-label="Four per row" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="5" height="5"/><rect x="9.5" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/><rect x="16" y="9.5" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><rect x="9.5" y="16" width="5" height="5"/><rect x="16" y="16" width="5" height="5"/></svg></button>

      </div>
      <p class="count" id="count" aria-live="polite">Loading…</p>
      <div class="sort">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="rated">Top rated</option>
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
          <option value="discount">Discount</option>
          <option value="az">Alphabetically, A–Z</option>
          <option value="za">Alphabetically, Z–A</option>
        </select>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="container coll-layout">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters-head"><span>Filter</span><button class="icon-btn" id="filterClose" type="button" aria-label="Close filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

      <div class="filters-apply"><button class="btn btn-solid btn-block" id="filterApply" type="button">Show results</button></div>

        <div class="grid list-4" id="grid"></div>
        <div class="load-more" id="loadMore"></div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
