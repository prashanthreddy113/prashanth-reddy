# Netlify configuration for the AquaProof React frontend (create a separate Netlify site with base "water-tanker/frontend").
# The .NET API is hosted separately (see README); set VITE_API_URL in Netlify → Site configuration → Environment variables.

[build]
  base    = "water-tanker/frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://aquaproof-api.onrender.com"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
