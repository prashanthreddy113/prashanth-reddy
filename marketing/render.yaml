# One-click deploy of the marketing API + PostgreSQL on Render (https://render.com).
# Render → New → Blueprint → point at this repository and choose marketing/render.yaml.
# Then set VITE_API_URL on Netlify to the API URL Render gives you.
services:
  - type: web
    name: marketing-api
    runtime: docker
    dockerfilePath: ./marketing/backend/Dockerfile
    dockerContext: ./marketing/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Admin__Username
        value: admin
      - key: Admin__Password
        sync: false   # set this in the Render dashboard
      - key: Cors__AllowedOrigins
        sync: false   # e.g. https://your-marketing-site.netlify.app
      - key: Company__Name
        value: My Company
      - key: Company__Currency
        value: INR
      - key: Company__DefaultCountryCode
        value: "91"
      - key: Company__TimeZone
        value: Asia/Kolkata
      - key: Anthropic__ApiKey
        sync: false   # optional; or paste the key in Settings → AI assistant

databases:
  - name: marketing-db
    plan: free
