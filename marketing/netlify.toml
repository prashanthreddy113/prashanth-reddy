# Netlify configuration for the marketing React frontend.
# Create a separate Netlify site for this app and set its "Base directory" to `marketing/frontend`
# (or point the site at this file). The .NET API is hosted separately (see marketing/README.md);
# set VITE_API_URL in Netlify → Site configuration → Environment variables to that API's public URL.

[build]
  base    = "marketing/frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route is served by index.html (React Router handles it).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
