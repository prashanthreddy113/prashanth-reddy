<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom Pregnancy Journal</title>
<meta name="description" content="Pregnancy tracker: due-date countdown, reports, tablet reminders, habits, sleep, stretches and mind games.">
<meta name="theme-color" content="#B24A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="nav" aria-label="Sections">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Bloom</span>
    </div>
    <nav id="tabs" class="tabs" role="tablist"></nav>
  </aside>

  <main id="main" class="main">
    <section id="view-today" class="view" data-view="today"></section>
    <section id="view-journey" class="view" data-view="journey" hidden></section>
    <section id="view-reports" class="view" data-view="reports" hidden></section>
    <section id="view-habits" class="view" data-view="habits" hidden></section>
    <section id="view-tablets" class="view" data-view="tablets" hidden></section>
    <section id="view-sleep" class="view" data-view="sleep" hidden></section>
    <section id="view-move" class="view" data-view="move" hidden></section>
    <section id="view-mind" class="view" data-view="mind" hidden></section>
    <section id="view-care" class="view" data-view="care" hidden></section>
    <section id="view-settings" class="view" data-view="settings" hidden></section>
    <p class="disclaimer">Bloom is a personal journal, not medical advice. Always follow your doctor’s guidance. Your data stays on this device.</p>
  </main>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="data.js"></script>
<script src="figures.js"></script>
<script src="app.js"></script>
</body>
</html>
