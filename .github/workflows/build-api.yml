# Compiles the .NET API on every push so backend regressions are caught early.
name: Build API

on:
  push:
    paths: [backend/**, .github/workflows/build-api.yml]
  pull_request:
    paths: [backend/**]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/StudyRoom.sln -c Release
