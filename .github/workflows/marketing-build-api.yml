# Compiles the marketing .NET API on every push so backend regressions are caught early.
name: Marketing – Build API

on:
  push:
    paths: [marketing/backend/**, .github/workflows/marketing-build-api.yml]
  pull_request:
    paths: [marketing/backend/**]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build marketing/backend/Marketing.sln -c Release
