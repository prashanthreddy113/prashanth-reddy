# Publishes the static site in srujan-reddy-site/ to GitHub Pages.
# Pages must use the "GitHub Actions" source (the configure-pages step tries to
# enable it automatically on first run).

name: Deploy Srujan Reddy site to GitHub Pages

on:
  push:
    branches: [main, master, claude/srujan-reddy-political-site-w7o5a1]
    paths: [srujan-reddy-site/**, .github/workflows/deploy-srujan-site-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: srujan-reddy-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
