<title>Mana Bandi Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700;800&display=swap">
<style>
  :root {
    --ground: #EFEAE0;
    --panel: #FFFFFF;
    --ink: #1F241F;
    --muted: #5E665C;
    --line: #DCD6C8;
    --green: #128A46;
    --green-deep: #0B6432;
    --yellow: #FFC72C;
    --orange: #E8641B;
    --red: #D32F2F;
    --cream: #FFFDF7;
    --app-ink: #1B1B1B;
    --app-muted: #5C5C5C;
    --app-line: #E6E0D2;
    --app-soft: #F3EFE4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #151A16; --panel: #1F2620; --ink: #ECEBE4; --muted: #A9B0A6; --line: #34403A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #151A16; --panel: #1F2620; --ink: #ECEBE4; --muted: #A9B0A6; --line: #34403A;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Noto Sans Telugu", "Noto Sans", system-ui, sans-serif;
    padding-inline: 16px; padding-block: 20px 40px;
  }
  h1, h2, h3 { font-family: "Noto Sans Telugu", "Noto Sans", sans-serif; font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.45; }
  .top { max-width: 1080px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mono { width: 52px; height: 52px; border-radius: 14px; background: var(--green); color: var(--yellow); display: grid; place-items: center; font-family: "Noto Sans Telugu", sans-serif; font-size: 30px; font-weight: 800; line-height: 1; }
  .brand h1 { font-size: 30px; }
  .brand p { margin: 0; color: var(--muted); font-size: 14px; }
  .switch { display: flex; gap: 6px; }
  .switch button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 400px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  /* Phone */
  .phone { width: 100%; max-width: 400px; margin: 0 auto; background: #111; border-radius: 44px; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.28); }
  .screen { background: var(--cream); color: var(--app-ink); border-radius: 34px; height: 780px; overflow: hidden; display: flex; flex-direction: column; position: relative; font-family: "Noto Sans Telugu", "Noto Sans", sans-serif; }
  .status { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 600; color: var(--app-muted); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; }
  .bar h2 { flex: 1; font-size: 23px; color: var(--app-ink); }
  .bar.tint { color: #fff; }
  .bar.tint h2 { color: #fff; }
  .icon-btn { width: 48px; height: 48px; border-radius: 14px; border: 0; background: rgba(0,0,0,.06); font-size: 22px; cursor: pointer; display: grid; place-items: center; }
  .bar.tint .icon-btn { background: rgba(255,255,255,.22); color: #fff; }
  .body { flex: 1; overflow-y: auto; padding: 8px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .voice { font-size: 16px; line-height: 1.5; color: var(--app-muted); padding: 0 4px; }
  .big { min-height: 72px; width: 100%; border: 0; border-radius: 18px; font: inherit; font-size: 22px; font-weight: 800; line-height: 1.4; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; color: #fff; background: var(--green); }
  .big.yellow { background: var(--yellow); color: var(--app-ink); }
  .big.orange { background: var(--orange); }
  .big.ghost { background: var(--app-soft); color: var(--app-ink); font-weight: 600; font-size: 19px; }
  .big.danger { background: #FBE4E4; color: var(--red); }
  .big:focus-visible, .tile:focus-visible, .chip:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--green-deep); outline-offset: 2px; }
  .service { min-height: 120px; border: 0; border-radius: 22px; display: grid; grid-template-columns: 96px 1fr; align-items: center; text-align: left; padding: 10px 16px 10px 8px; cursor: pointer; font: inherit; }
  .service .em { font-size: 64px; text-align: center; line-height: 1; }
  .service b { display: block; font-size: 30px; font-weight: 800; line-height: 1.45; }
  .service span { font-size: 17px; opacity: .9; line-height: 1.5; }
  .service.bike { background: var(--yellow); color: var(--app-ink); }
  .service.auto { background: var(--green); color: #fff; }
  .service.parcel { background: var(--orange); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid var(--app-line); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 17px; font-weight: 700; line-height: 1.5; cursor: pointer; min-height: 48px; }
  .chip.on { border-color: var(--green); background: #E4F3EA; }
  .field { background: #fff; border: 2px solid var(--app-line); border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; min-height: 64px; }
  .field .lbl { font-size: 14px; color: var(--app-muted); display: block; }
  .field input { flex: 1; border: 0; background: transparent; font: inherit; font-size: 20px; min-width: 0; color: var(--app-ink); }
  .field input:focus { outline: none; }
  .field.big-digits input { font-size: 32px; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  .mic { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--green); color: #fff; font-size: 24px; cursor: pointer; flex: none; }
  .fare { background: #fff; border-radius: 22px; padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; align-items: center; border: 2px solid var(--app-line); }
  .fare .amt { font-size: 48px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .fare .meta { color: var(--app-muted); font-size: 16px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tiles.three { grid-template-columns: 1fr 1fr 1fr; }
  .tile { border: 3px solid var(--app-line); background: #fff; border-radius: 20px; min-height: 96px; font: inherit; font-size: 18px; font-weight: 700; line-height: 1.45; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; color: var(--app-ink); }
  .tile .em { font-size: 34px; line-height: 1; }
  .tile small { font-weight: 400; font-size: 14px; color: var(--app-muted); }
  .tile.on { border-color: var(--green); background: #E4F3EA; }
  .tile.on.o { border-color: var(--orange); background: #FDEBDF; }
  .lang { min-height: 108px; font-size: 26px; }
  .nav { display: flex; border-top: 2px solid var(--app-line); background: #fff; }
  .nav button { flex: 1; min-height: 68px; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 700; line-height: 1.4; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--app-muted); }
  .nav button .em { font-size: 24px; }
  .nav button.on { color: var(--green-deep); }
  .card { background: #fff; border: 2px solid var(--app-line); border-radius: 22px; padding: 14px 16px; }
  .plate { font-size: 38px; font-weight: 800; letter-spacing: 2px; line-height: 1.3; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .otp { display: flex; gap: 10px; justify-content: center; }
  .otp b { width: 60px; height: 76px; display: grid; place-items: center; background: #fff; border: 3px solid var(--app-line); border-radius: 16px; font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .otp.green b { border-color: var(--green); background: #E4F3EA; }
  .otp.orange b { border-color: var(--orange); background: #FDEBDF; }
  .map { height: 170px; border-radius: 22px; background:
      linear-gradient(90deg, transparent 48%, #d8e3d3 48%, #d8e3d3 52%, transparent 52%),
      linear-gradient(0deg, transparent 58%, #d8e3d3 58%, #d8e3d3 62%, transparent 62%),
      #E7EEDF; position: relative; overflow: hidden; }
  .map .pin { position: absolute; font-size: 30px; }
  .map .cap { position: absolute; left: 20%; top: 40%; font-size: 30px; animation: drive 6s linear infinite; }
  @keyframes drive { from { left: 18%; } to { left: 62%; } }
  .pulse { width: 200px; height: 200px; margin: 30px auto 10px; border-radius: 50%; background: #E4F3EA; display: grid; place-items: center; font-size: 84px; position: relative; }
  .pulse::before, .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--green); opacity: 0; animation: ring 2s ease-out infinite; }
  .pulse::after { animation-delay: 1s; }
  .pulse.orange { background: #FDEBDF; } .pulse.orange::before, .pulse.orange::after { border-color: var(--orange); }
  @keyframes ring { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::before, .pulse::after, .map .cap { animation: none; } .pulse::before { opacity: .6; } }
  .steps { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 0; }
  .steps span { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--app-soft); font-size: 20px; }
  .steps span.on { background: var(--orange); }
  .steps i { width: 24px; height: 4px; background: var(--app-line); border-radius: 2px; }
  .row { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--app-line); border-radius: 18px; padding: 12px 14px; min-height: 68px; }
  .row .em { font-size: 30px; }
  .row b { font-size: 18px; display: block; } .row small { color: var(--app-muted); font-size: 14px; }
  .row .amt { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .faces { display: flex; gap: 10px; justify-content: center; }
  .faces button { width: 90px; height: 90px; border-radius: 24px; border: 3px solid var(--app-line); background: #fff; font-size: 44px; cursor: pointer; }
  .faces button.on { border-color: var(--green); background: #E4F3EA; }
  .greet { font-size: 26px; font-weight: 800; padding: 4px 4px 0; line-height: 1.45; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 90px; background: #1B1B1B; color: #fff; border-radius: 16px; padding: 12px 16px; font-size: 16px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .photo { height: 120px; border-radius: 18px; background: var(--app-soft); display: grid; place-items: center; color: var(--app-muted); font-size: 15px; border: 2px dashed var(--app-line); }
  .photo.taken { background: #FDEBDF; color: var(--orange); font-size: 48px; border-style: solid; border-color: var(--orange); }
  .splash { flex: 1; background: var(--green); color: #fff; display: grid; place-items: center; text-align: center; padding: 20px; cursor: pointer; }
  .splash .mono { width: 120px; height: 120px; border-radius: 32px; font-size: 72px; margin: 0 auto 16px; }
  .splash h2 { color: #fff; font-size: 38px; }
  .splash p { font-size: 18px; opacity: .9; margin: 6px 0 0; }
  .splash small { display: block; margin-top: 40px; opacity: .7; }

  /* Notes panel */
  .notes { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: env(safe-area-inset-top, 0px); }
  .notes .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .notes h2 { font-size: 24px; }
  .notes p { margin: 0; line-height: 1.55; font-size: 15px; max-width: 62ch; }
  .notes ul { margin: 0; padding-left: 20px; line-height: 1.55; font-size: 15px; max-width: 62ch; }
  .says { border-left: 4px solid var(--yellow); padding: 8px 14px; background: color-mix(in srgb, var(--yellow) 14%, var(--panel)); border-radius: 0 12px 12px 0; font-size: 15px; }
  .says b { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; }
  .jump button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .jump button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
</style>

<header class="top">
  <div class="brand">
    <div class="mono">మ</div>
    <div>
      <h1>మన బండి · Mana Bandi</h1>
      <p>Clickable prototype of the rider app · Narayanakhed / Zaheerabad launch</p>
    </div>
  </div>
  <div class="switch" role="group" aria-label="Prototype language">
    <button type="button" id="lang-te" aria-pressed="true">తెలుగు</button>
    <button type="button" id="lang-en" aria-pressed="false">English</button>
  </div>
</header>

<div class="wrap">
  <div class="phone"><div class="screen" id="screen"></div></div>

  <aside class="notes">
    <div>
      <div class="eyebrow" id="n-eyebrow">Screen</div>
      <h2 id="n-title">Splash</h2>
    </div>
    <div class="says"><b>🔊 The app says</b><span id="n-voice"></span></div>
    <p id="n-why"></p>
    <ul id="n-rules"></ul>
    <div>
      <div class="eyebrow" style="margin-bottom:8px">Jump to a screen</div>
      <div class="jump" id="jump"></div>
    </div>
    <div class="legend">
      <span><i style="background:#FFC72C"></i>Bike</span>
      <span><i style="background:#128A46"></i>Auto</span>
      <span><i style="background:#E8641B"></i>Parcel</span>
      <span><i style="background:#D32F2F"></i>Cancel / SOS only</span>
    </div>
  </aside>
</div>

      const v = window.speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith(state.lang === 'te' ? 'te' : 'en'));

        <button class="big orange" data-pstep="2">${t('next')} →</button>`;
      if (st === 2) body = `<div class="voice" style="font-size:20px;font-weight:700;color:var(--app-ink)">${t('p2')}</div>
        <div class="tiles three">
          <button class="tile o ${state.size === 's' ? 'on' : ''}" data-size="s"><span class="em">🍱</span>${t('small')}<small>${t('smallS')}</small></button>
          <button class="tile o ${state.size === 'm' ? 'on' : ''}" data-size="m"><span class="em">📦</span>${t('medium')}<small>${t('mediumS')}</small></button>
          <button class="tile o ${state.size === 'l' ? 'on' : ''}" data-size="l"><span class="em">🧳</span>${t('bigp')}<small>${t('bigS')}</small></button>
        </div>
        <div class="photo ${state.photo ? 'taken' : ''}">${state.photo ? '🖼️' : t('takePhoto')}</div>
        <button class="big ghost" data-photo="1">${state.photo ? t('photoTaken') : t('takePhoto')}</button>
        <div style="flex:1"></div>
        <button class="big orange" data-pstep="3">${t('next')} →</button>`;
      if (st === 3) { const f = fare(); body = `<div class="voice" style="font-size:20px;font-weight:700;color:var(--app-ink)">${t('p3')}</div>
        <div class="tiles">
          <button class="tile o ${state.payer === 'me' ? 'on' : ''}" data-payer="me">${t('me')}</button>
          <button class="tile o ${state.payer === 'rx' ? 'on' : ''}" data-payer="rx">${t('receiver')}</button>
        </div>
        <div class="fare"><div><div class="amt">₹${f.amt}</div><div class="meta">${f.km} ${t('km')} · ${({s:t('small'),m:t('medium'),l:t('bigp')})[state.size]}</div></div><div style="font-size:52px">📦</div></div>
        <div style="flex:1"></div>
        <button class="big orange" data-go="finding">${t('sendParcel')}</button>`; }
      return `${status()}${bar(t('pTitle'), t(['p1Voice','p2Voice','p3Voice'][st - 1]), st === 1 ? 'home' : 'pback', true)}<div class="body">${steps}${body}</div>`;
    },
    rides: () => `${status()}${bar(t('ridesTitle'), t('ridesVoice'))}<div class="body">
      <div class="row"><span class="em">🏍️</span><div><b>🚌 ${t('places')[1].slice(2)}</b><small>${t('today')} · 9:10</small></div><span class="amt">₹45</span></div>
      <div class="row"><span class="em">📦</span><div><b>గంగాపూర్ · Gangapur</b><small>${t('yday')} · 16:30</small></div><span class="amt">₹50</span></div>
      <div class="row"><span class="em">🛺</span><div><b>🏥 ${t('places')[2].slice(2)}</b><small>12 ${state.lang === 'te' ? 'ఆగస్టు' : 'Aug'} · 11:05</small></div><span class="amt">₹78</span></div>
      </div>${nav('rides')}`,
    help: () => `${status()}${bar(t('helpTitle'), t('helpVoice'))}<div class="body">
      <button class="big" data-toast="${t('callDemo')}">${t('callSupport')}</button>
      <button class="big ghost" data-toast="wa.me link">${t('wa')}</button>
      <button class="big ghost" data-go="lang">${t('changeLang')}</button>
      <button class="big ghost" data-toast="YouTube">${t('howTo')}</button>
      <div class="card" style="display:flex;gap:12px;align-items:center"><span style="font-size:34px">📵</span><div style="font-size:16px">${t('missed')}</div></div>
      </div>${nav('help')}`,
  };

  function render() {
    const key = state.screen === 'pride' ? 'ride' : state.screen;
    screen.innerHTML = S[key]();
    const n = NOTES[state.screen === 'ride' && state.service === 'parcel' ? 'pride' : state.screen] || NOTES.home;
    $('#n-eyebrow').textContent = n.en;
    const titles = { splash: 'మన బండి', lang: t('chooseLang'), phone: t('phoneTitle'), otp: t('otpTitle'), home: t('navHome'), book: t('bookTitle'), finding: t('finding'), ride: state.service === 'parcel' ? t('pRideTitle') : t('rideTitle'), done: t('doneTitle'), parcel: t('pTitle'), rides: t('ridesTitle'), help: t('helpTitle') };
    $('#n-title').textContent = titles[state.screen];
    const voices = { splash: t('tag'), lang: t('chooseLang'), phone: t('phoneVoice'), otp: t('otpVoice'), home: t('homeVoice'), book: t('bookVoice'), finding: t('findingVoice'), ride: state.service === 'parcel' ? t('pRideVoice') : t('rideVoice'), done: t('doneVoice'), parcel: t(['p1Voice','p2Voice','p3Voice'][state.parcelStep - 1]), rides: t('ridesVoice'), help: t('helpVoice') };
    $('#n-voice').textContent = voices[state.screen];
    $('#n-why').textContent = n.why;
    $('#n-rules').innerHTML = n.rules.map(r => `<li>${r}</li>`).join('');
    $('#jump').innerHTML = JUMPS.map(([k, l]) => `<button class="${state.screen === k ? 'on' : ''}" data-jump="${k}">${l}</button>`).join('');
    $('#lang-te').setAttribute('aria-pressed', state.lang === 'te');
    $('#lang-en').setAttribute('aria-pressed', state.lang === 'en');
  }
  function go(s) {
    if (s === 'pback') { state.parcelStep = Math.max(1, state.parcelStep - 1); state.screen = 'parcel'; render(); return; }
    if (s === 'parcel' && state.screen !== 'parcel') state.parcelStep = 1;
    if (s === 'home') { state.drop = ''; }
    state.screen = s; render();
    if (s === 'finding') setTimeout(() => { if (state.screen === 'finding') { go('ride'); speak(state.service === 'parcel' ? t('pRideVoice') : t('rideVoice')); } }, 3000);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-go],[data-say],[data-svc],[data-chip],[data-pay],[data-mic],[data-pstep],[data-size],[data-payer],[data-photo],[data-face],[data-toast],[data-lang],[data-jump]');
    if (!b) return;
    const d = b.dataset;
    if (d.toast) toast(d.toast);
    if (d.say) { speak(d.say); return; }
    if (d.lang) { if (d.lang === 'te' || d.lang === 'en') { state.lang = d.lang; } else { state.lang = 'en'; toast('Prototype: ' + b.textContent + ' → English strings; the Android app has this language'); } speak(state.lang === 'te' ? 'నమస్తే! మన బండికి స్వాగతం' : 'Namaste! Welcome to Mana Bandi'); go('phone'); return; }
    if (d.jump) { go(d.jump); return; }
    if (d.svc) { state.service = d.svc; state.drop = ''; go(d.svc === 'parcel' ? 'parcel' : 'book'); return; }
    if (d.chip) { if (d.chip === '📞') { state.drop = t('tellCaptain'); } else { state.drop = d.chip; } if (state.screen === 'home') { state.service = 'bike'; go('book'); } else render(); return; }
    if (d.pay) { state.pay = d.pay; render(); return; }
    if (d.mic) { listen(txt => { state.drop = txt; render(); }); return; }
    if (d.pstep) { state.parcelStep = +d.pstep; render(); speak(t(['p1Voice','p2Voice','p3Voice'][state.parcelStep - 1])); return; }
    if (d.size) { state.size = d.size; render(); return; }
    if (d.payer) { state.payer = d.payer; render(); return; }
    if (d.photo) { state.photo = true; render(); return; }
    if (d.face) { state.face = d.face; render(); return; }
    if (d.go) go(d.go);
  });
  document.addEventListener('input', e => { if (e.target.id === 'drop') state.drop = e.target.value; });
  $('#lang-te').addEventListener('click', () => { state.lang = 'te'; state.name = 'లక్ష్మి'; render(); });
  $('#lang-en').addEventListener('click', () => { state.lang = 'en'; state.name = 'Lakshmi'; render(); });
  if ('speechSynthesis' in window) { try { window.speechSynthesis.onvoiceschanged = () => {}; window.speechSynthesis.getVoices(); } catch (e) {} }
  render();
})();
</script>
